name: Deploy Frontend

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    env:
      TF_DIR: terraform
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js (Static Export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://u5gkfzc94l.execute-api.us-east-1.amazonaws.com' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET || 'banca-simplificada-tf-state-324486142059' }}"
          TABLE="${{ secrets.TF_LOCK_TABLE || vars.TF_LOCK_TABLE || 'banca-simplificada-tf-lock' }}"
          
          INIT_ARGS="-backend-config=\"bucket=$BUCKET\" -backend-config=\"key=frontend/terraform.tfstate\" -backend-config=\"region=us-east-1\" -backend-config=\"encrypt=true\""
          
          if aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            INIT_ARGS="$INIT_ARGS -backend-config=\"dynamodb_table=$TABLE\""
            echo "Inicializando con bloqueo de estado en DynamoDB ($TABLE)."
          else
            echo "Inicializando sin bloqueo de estado (la tabla no existe o no es accesible)."
          fi
          
          eval "terraform init $INIT_ARGS"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="backend_url=${{ secrets.NEXT_PUBLIC_API_URL || 'https://u5gkfzc94l.execute-api.us-east-1.amazonaws.com' }}"

      - name: Sync Static Assets to S3
        run: |
          BUCKET=$(cd ${{ env.TF_DIR }} && terraform output -raw s3_bucket_name)
          
          # Sync all assets (with immutable cache-control)
          aws s3 sync out/ "s3://$BUCKET" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "_next/data/*"
          
          # Sync HTML files (with no-cache cache-control)
          aws s3 sync out/ "s3://$BUCKET" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"
          
          # Sync Next.js data files if they exist
          if [ -d "out/_next/data" ]; then
            aws s3 sync out/_next/data/ "s3://$BUCKET/_next/data/" \
              --cache-control "public, max-age=0, must-revalidate"
          fi

      - name: Invalidate CloudFront Cache
        run: |
          DIST_ID=$(cd ${{ env.TF_DIR }} && terraform output -raw cloudfront_distribution_id)
          if [ "$DIST_ID" != "N/A" ] && [ -not -z "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'
          else
            echo "CloudFront Distribution ID is N/A or empty, skipping invalidation."
          fi

      - name: Summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          URL=$(terraform output -raw website_url)
          CF_URL=$(terraform output -raw cloudfront_domain_name)
          {
            echo "## Deploy Frontend Completado 🚀"
            echo ""
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **S3 Static Website URL:** $URL"
            if [ "$CF_URL" != "N/A" ]; then
              echo "- **CloudFront HTTPS URL:** https://$CF_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
