name: Terraform Plan Frontend

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_DIR: terraform
      AWS_REGION: us-east-2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Bootstrap Frontend State (S3 + DynamoDB)
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET || 'banca-simplificada-tf-state-324486142059' }}"
          TABLE="${{ secrets.TF_LOCK_TABLE || 'banca-simplificada-tf-lock' }}"
          
          if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
            aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }}
          else
            aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
          fi
          
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled 2>/dev/null || true
          
          echo "Intentando configurar tabla de bloqueo DynamoDB..."
          aws dynamodb describe-table --table-name "$TABLE" --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Aviso: No se pudo configurar la tabla DynamoDB para bloqueo. Se procederá sin bloqueo de estado."

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET || 'banca-simplificada-tf-state-324486142059' }}"
          TABLE="${{ secrets.TF_LOCK_TABLE || 'banca-simplificada-tf-lock' }}"
          
          # Nota: Usamos us-east-1 para el state bucket y dynamo lock, coincidiendo con el backend si es compartido
          INIT_ARGS="-backend-config=\"bucket=$BUCKET\" -backend-config=\"key=frontend/terraform.tfstate\" -backend-config=\"region=us-east-1\" -backend-config=\"encrypt=true\""
          
          if aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            INIT_ARGS="$INIT_ARGS -backend-config=\"dynamodb_table=$TABLE\""
            echo "Inicializando con bloqueo de estado en DynamoDB ($TABLE)."
          else
            echo "Inicializando sin bloqueo de estado (la tabla no existe o no es accesible)."
          fi
          
          eval "terraform init $INIT_ARGS"

      - name: Terraform Fmt Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true
        id: fmt

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color
        id: validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var="backend_url=${{ secrets.BACKEND_URL || 'http://localhost:3000/api' }}" 2>&1 | tee plan_output.txt
          EXIT=${PIPESTATUS[0]}
          echo "exitcode=$EXIT" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: Post Plan as PR Comment
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_FMT: ${{ steps.fmt.outcome }}
          PLAN_VALIDATE: ${{ steps.validate.outcome }}
          PLAN_RESULT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const planPath = path.join('${{ env.TF_DIR }}', 'plan_output.txt');
            let plan = '';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
            } catch (e) {
              plan = '(no se pudo leer la salida del plan)';
            }

            // GitHub limita los comentarios a ~65k chars. Truncamos del medio.
            const MAX = 60000;
            if (plan.length > MAX) {
              const half = Math.floor(MAX / 2);
              plan = plan.slice(0, half) +
                '\n\n... (truncado, ver logs del workflow para el plan completo) ...\n\n' +
                plan.slice(-half);
            }

            const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';

            const body = [
              '### Frontend Infrastructure Plan 🚀',
              '',
              `- ${icon(process.env.PLAN_FMT)} \`terraform fmt\``,
              `- ${icon(process.env.PLAN_VALIDATE)} \`terraform validate\``,
              `- ${icon(process.env.PLAN_RESULT)} \`terraform plan\``,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`*`,
            ].join('\n');

            const marker = '<!-- terraform-frontend-plan-comment -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
